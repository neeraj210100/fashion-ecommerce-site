databases:
  - name: fashion-db
    plan: free
    databaseName: fashion
    user: fashion

services:
  # ---------- Spring Boot backend ----------
  - type: web
    name: fashion-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: fashion-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: fashion-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: fashion-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: fashion-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: fashion-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://fashion-web.onrender.com

  # ---------- React / Vite frontend ----------
  - type: web
    name: fashion-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    plan: free
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://fashion-api.onrender.com
      - key: NODE_VERSION
        value: "20"
