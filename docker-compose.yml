services:
  postgres:
    image: postgres:16-alpine
    container_name: fashion-ecommerce-db
    environment:
      POSTGRES_DB: fashion
      POSTGRES_USER: fashion
      POSTGRES_PASSWORD: fashion
    ports:
      - "5432:5432"
    volumes:
      - fashion_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fashion -d fashion"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fashion_pg_data:
